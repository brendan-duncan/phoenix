<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Phoenix Analytics</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="brand">Phoenix <span>analytics</span></div>
  <nav class="tabs" id="tabs" aria-label="Views">
    <button data-tab="overview">Overview</button>
    <button data-tab="realtime">Realtime</button>
    <button data-tab="events">Events</button>
    <button data-tab="reading">Reading</button>
    <button data-tab="downloads">Downloads</button>
    <button data-tab="admin">Admin</button>
  </nav>
  <div class="controls">
    <select id="range" aria-label="Date range">
      <option value="today">Today</option>
      <option value="24h">Last 24 hours</option>
      <option value="7d">Last 7 days</option>
      <option value="30d">Last 30 days</option>
      <option value="90d">Last 90 days</option>
      <option value="12m">Last 12 months</option>
      <option value="all">All time</option>
      <option value="custom">Custom…</option>
    </select>
    <span id="custom-range" class="custom-range" hidden>
      <input type="date" id="custom-from" aria-label="From">
      <span>to</span>
      <input type="date" id="custom-to" aria-label="To">
    </span>
    <button id="refresh" class="icon-btn" title="Refresh" aria-label="Refresh">↻</button>
    <details id="download" class="menu">
      <summary class="icon-btn" title="Download this page" aria-label="Download this page">⤓</summary>
      <div class="menu-list" role="menu">
        <button role="menuitem" data-format="pdf">PDF</button>
        <button role="menuitem" data-format="html">HTML</button>
        <button role="menuitem" data-format="md">Markdown</button>
      </div>
    </details>
    <button id="theme" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </div>
</header>
<div id="filters" class="filters" hidden></div>
<main id="view" class="view"></main>
<div id="tooltip" class="tooltip" role="status" hidden></div>
<footer class="footer">IP geolocation by <a href="https://db-ip.com" rel="noopener">DB-IP</a> (CC BY 4.0).</footer>
</body>
</html>
