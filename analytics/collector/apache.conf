# Paste inside the <VirtualHost *:443> block of
# /etc/apache2/sites-available/phoenixanimate-le-ssl.conf, after DocumentRoot.
# Needs mod_proxy and mod_proxy_http (sudo a2enmod proxy proxy_http).
#
# Everything under /a/ goes to the collector on 127.0.0.1:8791:
#   /a/collect     public beacon endpoint
#   /a/dashboard/  dashboard + API, password-checked by the collector itself
# mod_proxy appends the visitor's IP to X-Forwarded-For; the collector trusts
# only the last entry, and only because the connection comes from 127.0.0.1.
#
# The RewriteRules for /updates/ and /download/ in the same vhost only match
# those prefixes, so they never see /a/ and their order relative to this block
# doesn't matter. Don't add a catch-all RewriteRule above it without a
# `RewriteRule ^/a/ - [L]` exemption first.
<Location "/a/">
    ProxyPass        "http://127.0.0.1:8791/" timeout=10
    ProxyPassReverse "http://127.0.0.1:8791/"
    # Beacons are tiny; refuse anything big before it reaches Node.
    LimitRequestBody 65536
</Location>
