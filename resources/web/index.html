<!doctype html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, user-scalable=0">
<title>Phoenix</title>
<link rel="icon" href="phoenix.png">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #2d2d2d; color: #e1e1e1;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #screen { width: 100%; height: 100%; }
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; text-align: center; padding: 16px; }
  #loading img { width: 96px; height: 96px; }
  #loading h1 { font-size: 22px; font-weight: 600; margin: 0; }
  #status { color: #a0a0a0; max-width: 34em; }
  #status.problem { color: #ff8a80; }
  .bar { width: 220px; height: 4px; border-radius: 2px; background: #444; overflow: hidden; }
  .bar div { width: 40%; height: 100%; background: #2a82da; animation: slide 1.2s ease-in-out infinite; }
  .problem ~ .bar { display: none; }
  @keyframes slide { from { margin-left: -40%; } to { margin-left: 100%; } }
</style>
</head>
<body>
<div id="loading">
  <img src="phoenix.png" alt="">
  <h1>Phoenix</h1>
  <div id="status">Loading…</div>
  <div class="bar"><div></div></div>
  <noscript>Phoenix needs JavaScript.</noscript>
</div>
<div id="screen" hidden></div>
<script>
  // The page Phoenix's web build runs in. Phoenix's threads need the page
  // to be cross-origin isolated (the server sends the COOP and COEP
  // headers; tools/web/serve.py does).
  const loading = document.getElementById("loading");
  const screen = document.getElementById("screen");
  const status = document.getElementById("status");

  // Settings to try from the address, for measuring what makes Phoenix
  // faster in a browser before it is built in:
  //   ?dpr=1           the whole window at 1 pixel per point, whatever the screen
  //   ?stagescale=1    the stage alone drawn at 1 pixel per point, scaled up
  //   ?memory=1024     start with this many MB of memory rather than growing to it
  //   ?threads=4       the threads Phoenix draws and decodes with (1 for none)
  //   ?guithreads=0    without Qt's threaded image and painting helpers
  //   ?audiobuffer=8192 the sound buffer, in frames (256 to 16384; 4096 by default)
  //   ?renderer=cpu    the stage drawn on the CPU rather than the GPU (WebGPU)
  const options = new URLSearchParams(location.search);
  const environment = {};
  const emscripten = {};
  if (options.has("dpr")) {
    const ratio = Math.max(0.5, Number(options.get("dpr")) || 1);
    Object.defineProperty(window, "devicePixelRatio", { get: () => ratio });
  }
  if (options.has("stagescale"))
    environment.PHOENIX_STAGE_SCALE = String(Math.max(0.25, Number(options.get("stagescale")) || 1));
  if (options.has("memory")) {
    const megabytes = Math.min(4032, Math.max(64, Math.round(Number(options.get("memory")) || 0)));
    emscripten.INITIAL_MEMORY = megabytes * 1024 * 1024;
  }
  if (options.has("threads"))
    environment.PHOENIX_THREADS = String(Math.max(1, Math.round(Number(options.get("threads")) || 1)));
  if (options.has("audiobuffer"))
    environment.PHOENIX_AUDIO_BUFFER = String(Math.round(Number(options.get("audiobuffer")) || 4096));
  if (options.has("debugdocks"))
    environment.PHOENIX_DEBUG_DOCKS = "1";
  if (options.get("renderer") === "cpu" || options.get("renderer") === "gpu")
    environment.PHOENIX_STAGE_RENDERER = options.get("renderer");
  if (options.get("guithreads") === "0")
    environment.QT_NO_GUI_THREADPOOL = "1";
  if (options.size)
    console.log("Phoenix web settings:", Object.fromEntries(options));

  function problem(text) {
    status.textContent = text;
    status.className = "problem";
    loading.hidden = false;
    screen.hidden = true;
  }

  async function start() {
    if (!window.crossOriginIsolated || typeof SharedArrayBuffer === "undefined") {
      problem("This page is not cross-origin isolated, so Phoenix cannot use threads. The server has to send the "
        + "Cross-Origin-Opener-Policy and Cross-Origin-Embedder-Policy headers (tools/web/serve.py does).");
      return;
    }
    status.textContent = "Loading Phoenix…";
    try {
      const config = {
        ...emscripten,
        qt: {
          entryFunction: window.Phoenix_entry,
          containerElements: [screen],
          environment,
          onLoaded: () => {
            loading.hidden = true;
            screen.hidden = false;
          },
          onExit: (exit) => {
            problem("Phoenix stopped" + (exit.text ? ": " + exit.text : exit.code !== undefined ? " (" + exit.code + ")." : "."));
          },
        },
      };
      // A page Phoenix runs inside (window.phoenixHost, as a document server
      // sets) may hand it a file to open and arguments to start with, and
      // takes back the documents it keeps when they are saved
      // (src/gui/web_files.h).
      if (window.phoenixHost && window.phoenixHost.prepare)
        await window.phoenixHost.prepare(config, status);
      const phoenix = await qtLoad(config);
      // The host may watch Phoenix from now on (its unsaved work, say).
      if (window.phoenixHost && window.phoenixHost.started)
        window.phoenixHost.started(phoenix);
      // Closing or reloading the page with changes not saved: the browser
      // asks first.
      window.addEventListener("beforeunload", (event) => {
        if (phoenix && phoenix._phoenix_has_unsaved_work && phoenix._phoenix_has_unsaved_work()) {
          event.preventDefault();
          event.returnValue = "";
        }
      });
    } catch (error) {
      console.error(error);
      problem("Phoenix could not start: " + error);
    }
  }
</script>
<script src="Phoenix.js"></script>
<script src="qtloader.js" onload="start()"></script>
</body>
</html>
