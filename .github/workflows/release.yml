# Builds Phoenix for each platform, packs it with Velopack and publishes it
# as the GitHub release for the tag: the installer people download, and the
# packages and feed installed copies update from (src/gui/updater.cpp).
#
# Run by pushing a version tag:
#   git tag v0.2.0 && git push origin v0.2.0
# A tag with a suffix (v0.2.0-beta.1) makes a pre-release, which installed
# copies do not update to.
#
# Run by hand from the Actions tab to try a version without publishing it:
# the packed release is kept as a workflow artifact instead.
#
# Windows x64 and macOS (Apple silicon, signed and notarized) are released
# so far. Linux and Windows arm64 are still to come, each a matrix entry
# once tools/release/pack.py can pack it.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.2.0-test.1"
        required: true
      publish:
        description: "Publish as the release v<version>"
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time, so two tags never race to upload.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            channel: win-x64
            generator: -A x64
          - os: macos-latest
            target: macos-arm64
            channel: osx-arm64
            generator: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            version="${version#v}"
            publish="${{ inputs.publish }}"
          else
            version="${GITHUB_REF_NAME#v}"
            publish=true
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$version is not <major>.<minor>.<patch>[-suffix]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "pre=--pre" >> "$GITHUB_OUTPUT"; fi

      # vpk must match the Velopack library the app links (pinned in
      # cmake/PhoenixVelopack.cmake).
      - name: Install vpk
        shell: bash
        run: |
          vpk_version=$(sed -n 's/^set(PHOENIX_VELOPACK_VERSION "\(.*\)")$/\1/p' cmake/PhoenixVelopack.cmake)
          dotnet tool install -g vpk --version "$vpk_version"

      - name: Configure and build
        shell: bash
        run: |
          cmake -S . -B build ${{ matrix.generator }} \
            -DPHOENIX_USE_SYSTEM_QT=OFF \
            -DPHOENIX_VERSION=${{ steps.version.outputs.version }} \
            -DPHOENIX_FFMPEG_REQUIRED=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --target Phoenix phoenix_tests --parallel

      - name: Run the tests
        shell: bash
        run: ctest --test-dir build -C Release -R phoenix_tests --output-on-failure

      # The Developer ID certificates go into a keychain of their own for
      # the run, with the notarization credentials beside them. The
      # identities' names are read back from it for pack.py.
      - name: Set up signing
        if: runner.os == 'macOS'
        id: signing
        shell: bash
        env:
          MACOS_APP_CERT_P12: ${{ secrets.MACOS_APP_CERT_P12 }}
          MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/phoenix-signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          echo "$MACOS_APP_CERT_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$MACOS_INSTALLER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          for p12 in app installer; do
            security import "$RUNNER_TEMP/$p12.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" \
              -f pkcs12 -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          done
          rm "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          app_identity=$(security find-identity -v "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          install_identity=$(security find-identity -v "$keychain" | sed -n 's/.*"\(Developer ID Installer: .*\)"/\1/p' | head -1)
          if [[ -z "$app_identity" || -z "$install_identity" ]]; then
            echo "::error::Developer ID identities not found in the keychain"
            security find-identity -v "$keychain"
            exit 1
          fi
          echo "Signing as '$app_identity' and '$install_identity'"

          xcrun notarytool store-credentials phoenix-notary --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --keychain "$keychain"

          {
            echo "keychain=$keychain"
            echo "app_identity=$app_identity"
            echo "install_identity=$install_identity"
          } >> "$GITHUB_OUTPUT"

      # The previous release, so that vpk can make a delta package from it.
      # There is none before the first release.
      - name: Fetch the previous release
        shell: bash
        run: |
          vpk download github --repoUrl "${{ github.server_url }}/${{ github.repository }}" \
            --token "${{ github.token }}" --channel ${{ matrix.channel }} --outputDir releases \
            || echo "No previous release to make a delta from"

      - name: Pack
        shell: bash
        run: |
          signing=()
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            signing=(--sign-app-identity "${{ steps.signing.outputs.app_identity }}"
                     --sign-install-identity "${{ steps.signing.outputs.install_identity }}"
                     --notary-profile phoenix-notary
                     --keychain "${{ steps.signing.outputs.keychain }}")
          fi
          python tools/release/pack.py --version ${{ steps.version.outputs.version }} \
            --build-dir build --out releases --target ${{ matrix.target }} "${signing[@]}"

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          vpk upload github --repoUrl "${{ github.server_url }}/${{ github.repository }}" \
            --token "${{ github.token }}" --channel ${{ matrix.channel }} --outputDir releases \
            --tag ${{ steps.version.outputs.tag }} \
            --releaseName "Phoenix ${{ steps.version.outputs.version }}" \
            --publish --merge ${{ steps.version.outputs.pre }}

      - name: Keep the release as an artifact
        if: steps.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: releases/

      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS' && steps.signing.outputs.keychain != ''
        shell: bash
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}"

  # Once every platform has uploaded: the release notes' Downloads section,
  # linking each platform's installer and portable archive.
  notes:
    needs: release
    if: always() && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link the installers in the release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            tag="v${version#v}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          python3 tools/release/release_notes.py --tag "$tag" --repo "${{ github.repository }}"
