# Builds Phoenix and its tests and runs the tests on every push to main and
# on pull requests, on each platform, so a test that fails on only one of
# them shows up before a release rather than in it (as
# jsfl_publishing_goes_to_the_host did on macOS in 0.7.0), and so does code
# only one platform compiles (the Claude Code panel's terminal). Built as the
# release builds them (release.yml), with the Qt archive and the JSFL, Python
# and ActionScript parts, but not packed.
#
# Linux is tried too; Phoenix is not released for it yet, so its job may
# fail without failing the run.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            generator: -A x64
            experimental: false
          - os: macos-latest
            generator: ""
            experimental: false
          - os: ubuntu-latest
            generator: ""
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # What Qt's archive needs on Linux to configure.
      - name: Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev libegl1-mesa-dev

      - name: Configure and build
        shell: bash
        run: |
          cmake -S . -B build ${{ matrix.generator }} \
            -DPHOENIX_USE_SYSTEM_QT=OFF \
            -DCMAKE_BUILD_TYPE=Release
          # A job count, always: with no number, --parallel on macOS's
          # Makefiles means `make -j` with no limit (see release.yml).
          jobs=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo "${NUMBER_OF_PROCESSORS:-4}")
          cmake --build build --config Release --target phoenix_tests Phoenix --parallel "$jobs"

      # As in release.yml, the Python script tests are left off on macOS.
      - name: Run the tests
        shell: bash
        env:
          PHOENIX_PYTHON: ${{ runner.os == 'macOS' && 'off' || '' }}
        run: ctest --test-dir build -C Release -R phoenix_tests --output-on-failure
