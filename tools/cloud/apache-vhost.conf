# Phoenix Cloud behind Apache: the service on @CLOUD_HOST@, and the play
# origin (HTML5 versions of documents, kept apart from the service's
# cookies) on @PLAY_HOST@. setup_server.sh fills in the names and installs
# this as /etc/apache2/sites-available/phoenix-cloud.conf; certbot then adds
# the HTTPS twins of these and redirects HTTP to them.

<VirtualHost *:80>
    ServerName @CLOUD_HOST@
    ProxyRequests Off
    ProxyPreserveHost On
    # Conversions and large uploads take a while; the service limits sizes.
    ProxyTimeout 900
    LimitRequestBody 0
    AllowEncodedSlashes NoDecode
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:@PORT@/ nocanon
    ProxyPassReverse / http://127.0.0.1:@PORT@/
    ErrorLog ${APACHE_LOG_DIR}/phoenix-cloud-error.log
    CustomLog ${APACHE_LOG_DIR}/phoenix-cloud-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName @PLAY_HOST@
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:@PLAY_PORT@/
    ProxyPassReverse / http://127.0.0.1:@PLAY_PORT@/
    ErrorLog ${APACHE_LOG_DIR}/phoenix-cloud-error.log
    CustomLog ${APACHE_LOG_DIR}/phoenix-cloud-access.log combined
</VirtualHost>
