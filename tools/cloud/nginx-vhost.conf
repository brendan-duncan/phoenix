# Phoenix Cloud behind nginx: the service on @CLOUD_HOST@, and the play
# origin (HTML5 versions of documents, kept apart from the service's
# cookies) on @PLAY_HOST@. setup_server.sh fills in the names and installs
# this as /etc/nginx/sites-available/phoenix-cloud; certbot then adds HTTPS
# and redirects HTTP to it.

server {
    listen 80;
    listen [::]:80;
    server_name @CLOUD_HOST@;

    # Conversions and large uploads take a while; the service limits sizes
    # and saves uploads as they arrive.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    access_log /var/log/nginx/phoenix-cloud-access.log;
    error_log /var/log/nginx/phoenix-cloud-error.log;

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name @PLAY_HOST@;

    access_log /var/log/nginx/phoenix-cloud-access.log;
    error_log /var/log/nginx/phoenix-cloud-error.log;

    location / {
        proxy_pass http://127.0.0.1:@PLAY_PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
